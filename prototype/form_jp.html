<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洗車記録入力 | エクストリーム洗車</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a2e;
            --secondary: #d4a574;
            --accent: #e74c3c;
            --success: #27ae60;
            --light: #ecf0f1;
        }

        body {
            font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5e6d3 0%, #e8d5c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        /* ========== HEADER ========== */
        .header {
            background: linear-gradient(135deg, #2d3561 0%, #1a1a2e 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            border-bottom: 5px solid var(--secondary);
        }

        .header-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            color: var(--secondary);
        }

        /* ========== FORM CONTENT ========== */
        .form-wrapper {
            padding: 40px 30px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 10px;
        }

        .section-title::before {
            content: '◆';
            color: var(--secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
        }

        .required {
            color: var(--accent);
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
            background: #f9f9f9;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--secondary);
            background: white;
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row.full {
            grid-column: 1 / -1;
        }

        /* ========== SERVICE SELECTION ========== */
        .service-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .service-option {
            position: relative;
        }

        .service-option input[type="radio"] {
            display: none;
        }

        .service-label {
            display: block;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f9f9f9;
        }

        .service-option input[type="radio"]:checked + .service-label {
            border-color: var(--secondary);
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.1) 0%, rgba(212, 165, 116, 0.05) 100%);
            font-weight: bold;
        }

        .service-label strong {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: var(--primary);
        }

        .service-price {
            font-size: 16px;
            font-weight: bold;
            color: var(--secondary);
        }

        /* ========== PAYMENT OPTIONS ========== */
        .payment-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .payment-option {
            position: relative;
        }

        .payment-option input[type="radio"] {
            display: none;
        }

        .payment-label {
            display: block;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f9f9f9;
            font-size: 13px;
        }

        .payment-option input[type="radio"]:checked + .payment-label {
            border-color: var(--secondary);
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.1) 0%, rgba(212, 165, 116, 0.05) 100%);
            font-weight: bold;
        }

        /* ========== SUBMIT ========== */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--secondary) 0%, #c9945a 100%);
            color: white;
            grid-column: 1 / -1;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 165, 116, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: #e0e0e0;
            color: var(--primary);
        }

        .btn-reset:hover {
            background: #d0d0d0;
        }

        /* ========== ALERTS ========== */
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            display: none;
            border-left: 4px solid;
        }

        .alert.success {
            background: #d5f4e6;
            color: var(--success);
            border-left-color: var(--success);
            display: block;
        }

        .alert.error {
            background: #fdeaea;
            color: var(--accent);
            border-left-color: var(--accent);
            display: block;
        }

        .alert strong {
            display: block;
            margin-bottom: 5px;
        }

        /* ========== INFO BOX ========== */
        .info-box {
            background: linear-gradient(135deg, #f0e6d3 0%, #ede0cf 100%);
            border-left: 4px solid var(--secondary);
            padding: 12px 15px;
            margin-bottom: 25px;
            border-radius: 5px;
            font-size: 12px;
            color: var(--primary);
        }

        .info-box strong {
            color: var(--secondary);
        }

        /* ========== LOADING ========== */
        .loading {
            display: none;
            text-align: center;
            color: var(--secondary);
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--secondary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 600px) {
            .form-wrapper {
                padding: 25px;
            }

            .service-options,
            .payment-options {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }

            .header-icon {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <span class="header-icon">🚗✨</span>
            <h1>XTREAM WASH</h1>
            <p>洗車記録入力フォーム</p>
        </div>

        <!-- FORM -->
        <div class="form-wrapper">
            <div id="alert" class="alert"></div>

            <div class="info-box">
                <strong>※ご注意:</strong> <span class="required">*</span> が付いている項目は必須入力です。
                ご記入後は「送信」ボタンをクリックしてください。
            </div>

            <form id="washForm">
                <!-- 顧客情報 -->
                <div class="form-section">
                    <div class="section-title">顧客情報</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone">電話番号 <span class="required">*</span></label>
                            <input type="tel" id="phone" name="phone" placeholder="090-1234-5678" required>
                        </div>
                        <div class="form-group">
                            <label for="name">顧客名</label>
                            <input type="text" id="name" name="name" placeholder="田中太郎">
                        </div>
                    </div>
                </div>

                <!-- サービス選択 -->
                <div class="form-section">
                    <div class="section-title">サービス選択</div>

                    <label>洗車コース <span class="required">*</span></label>
                    <div class="service-options">
                        <div class="service-option">
                            <input type="radio" id="handpolish" name="service" value="handpolish">
                            <label for="handpolish" class="service-label">
                                <strong>ハンドポリッシュ</strong>
                                <div class="service-price">¥10,000</div>
                            </label>
                        </div>
                        <div class="service-option">
                            <input type="radio" id="xtream" name="service" value="xtream" checked>
                            <label for="xtream" class="service-label">
                                <strong>エクストリーム</strong>
                                <div class="service-price">¥15,000</div>
                            </label>
                        </div>
                        <div class="service-option">
                            <input type="radio" id="deluxe" name="service" value="deluxe">
                            <label for="deluxe" class="service-label">
                                <strong>プレミアム</strong>
                                <div class="service-price">¥20,000</div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 支払い方法 -->
                <div class="form-section">
                    <div class="section-title">支払い方法</div>

                    <label>支払い方法 <span class="required">*</span></label>
                    <div class="payment-options">
                        <div class="payment-option">
                            <input type="radio" id="cash" name="payment" value="cash" checked>
                            <label for="cash" class="payment-label">💵 現金</label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" id="card" name="payment" value="card">
                            <label for="card" class="payment-label">💳 カード</label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" id="transfer" name="payment" value="transfer">
                            <label for="transfer" class="payment-label">🏦 振込</label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" id="other" name="payment" value="other">
                            <label for="other" class="payment-label">📱 その他</label>
                        </div>
                    </div>
                </div>

                <!-- 詳細情報 -->
                <div class="form-section">
                    <div class="section-title">詳細情報</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="operator">施工者名</label>
                            <input type="text" id="operator" name="operator" placeholder="例: 太郎">
                        </div>
                        <div class="form-group">
                            <label for="plate">車両ナンバー</label>
                            <input type="text" id="plate" name="plate" placeholder="例: 品 1234">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="discount">割引額 (¥)</label>
                        <input type="number" id="discount" name="discount" min="0" step="500" placeholder="0">
                    </div>

                    <div class="form-group form-row full">
                        <label for="notes">備考</label>
                        <textarea id="notes" name="notes" placeholder="特別な注記やコメント..."></textarea>
                    </div>
                </div>

                <!-- ボタン -->
                <div class="button-group">
                    <button type="reset" class="btn-reset">クリア</button>
                    <button type="submit" class="btn-submit">
                        <span class="loading" id="loading">
                            <div class="spinner"></div>
                            送信中...
                        </span>
                        <span id="submitText">送信</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('washForm');
        const alertBox = document.getElementById('alert');
        const loading = document.getElementById('loading');
        const submitText = document.getElementById('submitText');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const data = {
                phone: document.getElementById('phone').value,
                name: document.getElementById('name').value,
                service: document.getElementById('handpolish').checked ? 'ハンドポリッシュ' : 
                         document.getElementById('xtream').checked ? 'エクストリーム' : 'プレミアム',
                payment: document.querySelector('input[name="payment"]:checked').value,
                operator: document.getElementById('operator').value,
                plate: document.getElementById('plate').value,
                discount: document.getElementById('discount').value,
                notes: document.getElementById('notes').value,
                timestamp: new Date().toLocaleString('ja-JP')
            };

            // Show success message
            alertBox.className = 'alert success';
            alertBox.innerHTML = `
                <strong>✓ 送信完了！</strong>
                顧客: ${data.name || data.phone} | 
                コース: ${data.service} | 
                時刻: ${data.timestamp}
            `;

            // Log to console (in production, send to server)
            console.log('フォーム送信:', data);

            // Reset form
            form.reset();

            // Auto-hide alert after 5 seconds
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        });

        // Auto-hide alert on error
        document.getElementById('phone').addEventListener('change', (e) => {
            const phone = e.target.value.trim();
            if (phone && !/^[\+\d\s\-\(\)]{5,}$/.test(phone)) {
                alertBox.className = 'alert error';
                alertBox.innerHTML = '<strong>※電話番号の形式が正しくありません</strong>';
            } else {
                alertBox.style.display = 'none';
            }
        });

        console.log('エクストリーム洗車 - 入力フォーム準備完了 ✨');
    </script>
</body>
</html>
