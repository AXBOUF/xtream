# ============================================================================
# DOCKER COMPOSE CONFIGURATION
# Car Wash Management System - Complete Stack
# ============================================================================
# Services:
# - postgres: PostgreSQL database (port 5432)
# - backend: FastAPI API server (port 8000)
# - dashboard: Streamlit live dashboard (port 8501)
# - nginx: Reverse proxy (port 80)
# ============================================================================

version: '3.8'

services:
  # ========================================================================
  # POSTGRESQL DATABASE
  # ========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: washdata_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-washdata_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./project0/dataschema/dailyreport.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - washdata_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      - "com.example.description=Car Wash PostgreSQL Database"

  # ========================================================================
  # FASTAPI BACKEND API
  # ========================================================================
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    container_name: washdata_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-washdata_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      API_KEY: ${API_KEY:-dev-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - washdata_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    labels:
      - "com.example.description=Car Wash FastAPI Backend"

  # ========================================================================
  # STREAMLIT DASHBOARD
  # ========================================================================
  dashboard:
    build:
      context: .
      dockerfile: dashboard.dockerfile
    container_name: washdata_dashboard
    environment:
      FRONTEND_API_URL: ${FRONTEND_API_URL:-http://backend:8000/api}
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_HEADLESS: ${STREAMLIT_SERVER_HEADLESS:-true}
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: false
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
      - /app/.streamlit
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - washdata_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - "com.example.description=Car Wash Streamlit Dashboard"

  # ========================================================================
  # NGINX REVERSE PROXY (Optional - for production)
  # ========================================================================
  # Uncomment to enable reverse proxy
  # nginx:
  #   image: nginx:alpine
  #   container_name: washdata_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - backend
  #     - dashboard
  #   networks:
  #     - washdata_network
  #   restart: unless-stopped

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  washdata_network:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
